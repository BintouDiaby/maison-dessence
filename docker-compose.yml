version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: maison_dessence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["bash", "-c", "python manage.py migrate --noinput && python manage.py seed_products || true && python manage.py train_recommender || true && python manage.py runserver 0.0.0.0:8000"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: maison_dessence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  pgdata:
