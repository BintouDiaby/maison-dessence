<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maison d'essence — Accueil</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="container header">
    <div class="brand">Maison d'essence</div>
    <nav class="nav">
      <a href="/products.html">Produits</a>
      <a href="/about.html">À propos</a>
      <a href="/login.html">Se connecter</a>
      <form id="product-search-form" style="display:inline-block;margin-left:12px">
        <input id="product-search-input" type="search" placeholder="Recherche…" aria-label="Recherche" style="padding:6px 8px;border-radius:8px;border:1px solid #eee" />
      </form>
      <button id="open-cart" class="cart-btn">Panier <span id="cart-count" class="cart-count">0</span></button>
    </nav>
  </header>

  <section class="hero" role="banner">
    <div class="hero-inner">
      <h1>Parfums d'exception</h1>
      <p>Découvrez une collection raffinée, sélectionnée avec soin pour éveiller les sens.</p>
      <p>
        <a class="btn btn-primary" href="/products.html">Voir la collection</a>
        <a class="btn btn-ghost" href="/about.html" style="margin-left:12px">En savoir plus</a>
      </p>
    </div>
  </section>

  <main class="container section">
    <h2>Nouveautés</h2>
    <div id="products-grid" class="grid"></div>
  </main>

  <!-- cart drawer -->
  <aside id="cart-drawer" class="drawer" aria-hidden="true">
    <div class="head">
      <strong>Votre panier</strong>
      <button id="close-drawer" class="drawer-close">Fermer</button>
    </div>
    <div class="items" id="drawer-items"></div>
    <div class="checkout-row">
      <div class="total">Total: <span id="drawer-total">€0.00</span></div>
      <div><a class="btn btn-primary" href="/checkout.html">Passer au paiement</a></div>
    </div>
  </aside>

  <footer class="container footer">
    © Maison d'essence — 2025
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
