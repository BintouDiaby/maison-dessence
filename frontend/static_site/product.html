<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Détails produit — Maison d'essence</title>
  <link rel="stylesheet" href="/static/styles.css" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            fadeInUp: {
              '0%': { opacity: 0, transform: 'translateY(20px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            pop: {
              '0%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.15)' },
              '100%': { transform: 'scale(1)' },
            }
          },
          animation: {
            fadeInUp: 'fadeInUp 0.8s ease-out both',
            pop: 'pop 0.4s ease-out both',
          },
        },
      },
    };
  </script>
</head>

<body class="bg-white text-gray-800 font-sans">
  <!-- Header -->
  <header class="container mx-auto flex justify-between items-center py-4 px-6 sticky top-0 bg-white/80 backdrop-blur-md shadow-sm z-50">
    <div class="brand text-xl font-semibold tracking-wide">Maison d'essence</div>
    <nav class="flex items-center gap-5 text-gray-700 font-medium">
      <a href="/" class="hover:text-indigo-600 transition">Accueil</a>
      <a href="/products.html" class="hover:text-indigo-600 transition">Produits</a>
      <a href="/about.html" class="hover:text-indigo-600 transition">À propos</a>
      <button id="open-cart" class="cart-btn flex items-center gap-1 hover:scale-105 transition-transform">
        Panier <span id="cart-count" class="bg-indigo-600 text-white text-sm rounded-full px-2 py-0.5">0</span>
      </button>
    </nav>
  </header>

  <!-- Section principale -->
  <main id="product-detail" class="container mx-auto px-6 py-12">
    <div class="flex flex-wrap gap-10 items-start justify-center md:justify-between animate-fadeInUp">
      <!-- Image produit -->
      <div class="flex-1 min-w-[300px] max-w-[520px]">
    <div class="overflow-hidden rounded-2xl shadow-lg hover:shadow-xl transition-transform duration-500 hover:scale-[1.02]">
    <img id="p-img" src="/static/images/placeholder_900x600.svg" alt="Image du produit"
      class="w-full h-[480px] object-cover" />
        </div>
      </div>

      <!-- Détails produit -->
      <div class="flex-1 min-w-[300px] max-w-[480px]">
        <p id="p-family" class="text-sm text-gray-500 mb-2">&nbsp;</p>
        <h1 id="p-name" class="text-3xl font-bold mb-3">Nom du parfum</h1>

        <!-- Info vendeur -->
        <div class="text-sm text-gray-600 mb-3">
          <span>Vendeur : <strong id="p-seller">&nbsp;</strong></span>
          <span class="mx-2">•</span>
          <span>Boutique : <strong id="p-shop">&nbsp;</strong></span>
        </div>

        <div class="flex items-center gap-6 mb-4">
          <div id="p-price" class="text-2xl font-extrabold text-indigo-700">€0.00</div>
          <div id="p-stock" class="text-sm text-gray-500">Stock : —</div>
        </div>

        <p id="p-concentration" class="text-sm text-gray-500 mb-4">&nbsp;</p>
        <p id="p-desc" class="text-gray-700 leading-relaxed mb-6">Description complète du parfum.</p>

        <div class="flex items-center gap-4">
          <button id="add-single"
            class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-300 shadow-md">
            Ajouter au panier
          </button>
          <a id="see-more" href="/products.html"
             class="border border-indigo-600 text-indigo-600 px-5 py-2 rounded-lg hover:bg-indigo-50 transition-all duration-300">
            Voir la collection
          </a>
        </div>
      </div>
    </div>

    <!-- Section similaires -->
    <section class="mt-16">
      <h3 class="text-2xl font-semibold text-center mb-8">Vous pourriez aimer aussi</h3>
      <div id="similar-list"
           class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 animate-fadeInUp">
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center py-8 text-gray-500 border-t">© Maison d'essence — 2025</footer>

  <!-- Script principal -->
  <script src="/static/app.js"></script>

  <!-- Animations visuelles -->
  <script>
    // Le comportement d'ajout au panier est géré par app.js (vérifie l'authentification)

    // Animation “reveal” des produits similaires
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('opacity-100', 'translate-y-0');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('#similar-list .card').forEach(el => {
      el.classList.add('opacity-0', 'translate-y-5', 'transition-all', 'duration-700');
      observer.observe(el);
    });
  </script>
</body>
</html>
